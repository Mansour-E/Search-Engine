# ─────────────────────────────────────────────────────────────────────────────
# PostgreSQL – PersistentVolumeClaim
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: search-engine
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
# ─────────────────────────────────────────────────────────────────────────────
# PostgreSQL – Secret (base64: echo -n 'value' | base64)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: search-engine
type: Opaque
data:
  # "postgres"  →  cG9zdGdyZXM=
  POSTGRES_USER:     cG9zdGdyZXM=
  # "9157"      →  OTE1Nw==
  POSTGRES_PASSWORD: OTE1Nw==
  # "IS-Project" → SVMtUHJvamVjdA==
  POSTGRES_DB:       SVMtUHJvamVjdA==
---
# ─────────────────────────────────────────────────────────────────────────────
# PostgreSQL – Deployment
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: search-engine
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-secret
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
---
# ─────────────────────────────────────────────────────────────────────────────
# PostgreSQL – Service (ClusterIP, nur intern erreichbar)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: search-engine
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
